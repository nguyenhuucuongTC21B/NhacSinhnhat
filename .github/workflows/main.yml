name: Build NhacSinhNhat.exe

# Tự động build file exe Windows khi:
#  - đẩy code lên nhánh main/master
#  - đẩy tag v... (vd: v3.6.2) → tạo GitHub Release kèm file exe
#  - bấm "Run workflow" thủ công trong tab Actions
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Cần quyền write để tạo Release khi đẩy tag
permissions:
  contents: write

jobs:
  build:
    name: Build Windows 64-bit
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Go (đọc phiên bản từ go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Chạy 54 kiểm thử E2E
        run: |
          go build -tags nogui -o nsn-e2e .
          NSN_E2E=1 ./nsn-e2e

      - name: Build NhacSinhNhat.exe (Windows x64, có icon bánh nhúng sẵn)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o NhacSinhNhat.exe .
          ls -la NhacSinhNhat.exe

      - name: Lưu artifact exe (tải được ở mục Summary của mỗi lần chạy)
        uses: actions/upload-artifact@v4
        with:
          name: NhacSinhNhat-win64
          path: NhacSinhNhat.exe

      - name: Tạo GitHub Release kèm exe (chỉ khi đẩy tag v...)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NhacSinhNhat.exe
          generate_release_notes: true
